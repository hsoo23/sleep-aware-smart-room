[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sleep-aware-smart-room"
version = "0.1.0"
description = "Closed-loop edge-AI drowsiness detection and intention-aware smart-room control research baseline"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "numpy>=1.24",
  "python-dotenv>=1.0",
  "requests>=2.31",
]

[project.scripts]
sleep-aware = "sleep_aware.cli:main"

[project.optional-dependencies]
host = ["opencv-python>=4.8", "mediapipe>=0.10", "pyautogui>=0.9"]
server = ["flask>=3.0"]
raspberrypi = ["RPi.GPIO>=0.7"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
# legacy/ preserves the submitted prototype verbatim; it is never linted or auto-fixed.
extend-exclude = ["legacy"]
force-exclude = true

[tool.ruff.lint]
# Pin the rule set explicitly so CI results do not change with Ruff's default rules.
select = ["E", "F", "W", "I", "B", "UP"]

